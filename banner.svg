<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="460" viewBox="0 0 1600 460" fill="none" font-family="Space Grotesk,Inter,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Maximilien White — The OS composes">
  <defs>
    <linearGradient id="void" x1="0" y1="0" x2="1600" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07080B"/><stop offset=".55" stop-color="#0B0E15"/><stop offset="1" stop-color="#101420"/>
    </linearGradient>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientTransform="translate(1290 150) scale(420)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4E8" stop-opacity=".34"/><stop offset="1" stop-color="#2DD4E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientTransform="translate(300 430) scale(360)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity=".26"/><stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0" cy="0" r="1" gradientTransform="translate(880 470) scale(300)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0B429" stop-opacity=".16"/><stop offset="1" stop-color="#F0B429" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="100" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4E8"/><stop offset=".55" stop-color="#8B7CF6"/><stop offset="1" stop-color="#F0B429"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2DD4E8" stop-opacity="0"/><stop offset=".5" stop-color="#2DD4E8"/><stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#1A1E27" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
  </defs>

  <rect width="1600" height="460" fill="url(#void)"/>
  <rect width="1600" height="460" fill="url(#grid)" opacity=".55"/>
  <circle cx="1290" cy="150" r="420" fill="url(#g1)"/>
  <circle cx="300" cy="430" r="360" fill="url(#g2)"/>
  <circle cx="880" cy="470" r="300" fill="url(#g3)"/>

  <!-- the object: nested projection rings -->
  <g transform="translate(1290 230)">
    <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" stroke="#5A6379" stroke-opacity=".5" stroke-width="1.3" fill="none"/>
    <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69" stroke="#8B7CF6" stroke-opacity=".85" stroke-width="1.6" fill="none"/>
    <polygon points="0,-86 75,-43 75,43 0,86 -75,43 -75,-43" stroke="#2DD4E8" stroke-width="2" fill="none"/>
    <g fill="#5A6379" opacity=".8">
      <circle cx="0" cy="-190" r="4.5"/><circle cx="165" cy="-95" r="4.5"/><circle cx="165" cy="95" r="4.5"/>
      <circle cx="0" cy="190" r="4.5"/><circle cx="-165" cy="95" r="4.5"/><circle cx="-165" cy="-95" r="4.5"/>
    </g>
    <g fill="#8B7CF6">
      <circle cx="0" cy="-138" r="4"/><circle cx="120" cy="-69" r="4"/><circle cx="120" cy="69" r="4"/>
      <circle cx="0" cy="138" r="4"/><circle cx="-120" cy="69" r="4"/><circle cx="-120" cy="-69" r="4"/>
    </g>
    <circle cx="0" cy="0" r="40" fill="#2DD4E8" opacity=".16" filter="url(#soft)"/>
    <circle cx="0" cy="0" r="9" fill="#2DD4E8"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#2DD4E8" stroke-opacity=".5" stroke-width="1.3"/>
  </g>

  <!-- wordmark -->
  <text x="100" y="150" font-size="14" font-weight="600" letter-spacing="6" fill="#2DD4E8">MAXIMILIEN WHITE</text>
  <text x="98" y="228" font-size="58" font-weight="700" letter-spacing="-2" fill="url(#hl)">The OS composes.</text>
  <text x="98" y="292" font-size="58" font-weight="700" letter-spacing="-2" fill="#5A6379">The domains remain real.</text>
  <rect x="100" y="322" width="560" height="3" rx="1.5" fill="url(#rule)"/>
  <text x="100" y="362" font-size="17" fill="#8B93A7">Systems architect · Uniformity OS · RESELL · SUBANGEL</text>
  <text x="100" y="394" font-size="13.5" font-family="JetBrains Mono,ui-monospace,Consolas,monospace" fill="#5A6379">Object → State → Signal → Evidence → Intelligence → Action → Verification → History</text>
</svg>